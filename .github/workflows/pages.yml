name: Web-App veröffentlichen

# Veröffentlicht den Inhalt von docs/ als GitHub Pages.
# "enablement: true" schaltet Pages selbst ein – in den Repository-Einstellungen
# muss dafür nichts konfiguriert werden. Nötig ist nur, dass das Repository
# öffentlich ist (bei privaten Repositories verlangt Pages ein bezahltes Konto).

on:
  push:
    branches: [claude/educational-game-kids-x0xyc3]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Solange das Repository privat ist, überspringt sich der Job selbst,
    # statt mit einer Fehlermeldung abzubrechen. Manuell gestartet
    # ("Run workflow") wird immer ein Versuch unternommen.
    if: github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Pages einrichten (aktiviert Pages bei Bedarf)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Inhalt von docs/ hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
